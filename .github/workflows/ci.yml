name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      # The manifest is platform-independent JSON — the validator reads the same bytes on
      # every OS — so this gate runs once, on Linux only, same as Task 6's eval step.
      - name: Install Claude Code CLI
        if: runner.os == 'Linux'
        # Deliberately unpinned: the point of this gate is to notice when the installed
        # CLI's validation behavior changes. If this step turns CI red on a commit that
        # didn't touch the plugin, the CLI released a new version, not a plugin regression.
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin manifest
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          claude plugin validate . --strict
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            # Documented as a validator-internal error. Not reproducible on CLI 2.1.288 —
            # nonexistent paths, malformed JSON, and bad flags all exited 1, not 2. This
            # branch is defensive insurance against a documented exit code; it may never
            # fire. Do not chase a mutation to prove it — it is the defensively redundant
            # case Plan 3 already settled.
            echo "::error::claude plugin validate itself failed (exit 2) — this is a toolchain problem, not a plugin problem"
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::plugin manifest is invalid or has warnings under --strict (exit $code)"
            exit 1
          fi
          echo "plugin manifest validated"

  # Whether the eval CAN run is a property of the repository's secrets, and the
  # `secrets` context is not available in a job-level `if:`. So one tiny job
  # reads it and publishes a boolean that the eval job gates on.
  #
  # What this buys is the check NAME in the pull request list. The first version
  # of this put the test inside the eval job and exited 0 when the key was
  # missing, which rendered as a GREEN "eval" check that had measured nothing:
  # a passing eval and an absent eval were indistinguishable at a glance.
  # Measured on PR #4 — "eval  pass  9s" — where 9 seconds was the guard
  # echoing a notice nobody reads. In a project whose rule is "report only what
  # is true", a check that misleads by omission is worse than no check, so the
  # unconfigured case now shows as SKIPPED, which is what it is.
  eval-gate:
    # Each case runs with the plugin and, by default, again without it (the
    # no-plugin baseline), so two cases is already several full agent runs
    # per invocation — disproportionate for a branch that might be pushed
    # twenty times before it's reviewed. Gate this where the signal is
    # actually needed: a pull request, or on demand.
    # Manual only, deliberately. This suite cannot make harness-init fire —
    # `disable-model-invocation: true` keeps the skill out of Claude's context,
    # and the runner passes prompts verbatim rather than expanding slash
    # commands (both confirmed in the Claude Code docs; see the README). So a
    # pull-request trigger spent ~$1.31 and ~11 minutes per run to produce a
    # `meanDelta: 0` the README explicitly says means nothing about the plugin.
    #
    # Kept rather than deleted: the suite, the graders and the diagnostics are
    # all correct, and the moment the skill becomes model-invocable this starts
    # measuring something real. Until then it runs when someone asks for it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - name: Is the eval suite configured to run?
        id: probe
        shell: bash
        env:
          # Either credential works, and CLAUDE_CODE_OAUTH_TOKEN is preferred:
          # `claude setup-token` mints a long-lived token against an existing
          # Claude subscription, so the measurement bills to the plan rather
          # than to API credits and no API key has to exist at all. The key
          # remains supported for API-billed accounts.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Publishes only whether a credential is non-empty. Never echo either
          # value, and never say which one is set beyond its name — the token
          # and the key are both secrets.
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is set — the eval suite will run on the subscription credential."
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is set — the eval suite will run on API billing."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The eval suite will be SKIPPED, not passed — no credential is set on this repository. Run 'claude setup-token' and add the result as CLAUDE_CODE_OAUTH_TOKEN under Settings > Secrets and variables > Actions (bills to your Claude subscription), or set ANTHROPIC_API_KEY for API billing. Until then there is no measured delta."
          fi

  eval:
    needs: eval-gate
    # A skipped job reads as skipped in the checks list. That is the whole point;
    # see eval-gate above for why exiting 0 here was the wrong answer.
    if: needs.eval-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Deliberately unpinned — same rationale as the manifest-validation step above.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      # The eval grants Bash, and Claude Code refuses to grant a shell it
      # cannot confine (sandbox.failIfUnavailable). GitHub's ubuntu runner
      # ships neither backend, so without this every arm aborts with turns=0
      # before the model is called — which is how three earlier runs produced
      # a meaningless `meanDelta: 0`.
      - name: Install the Bash sandbox backend
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
      - name: Run the plugin eval suite
        shell: bash
        env:
          # Both are passed; the CLI uses whichever is present. eval-gate has
          # already established that at least one is.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # No missing-credential guard here on purpose: eval-gate already
          # decided that, and this job does not start otherwise. A second check
          # for the same fact is the drift shape — two places asserting one
          # condition, and the stale copy is the one nobody reads. If both are
          # somehow empty past the gate, let the CLI fail loudly, not exit 0.
          set +e
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --allow-tools Bash Write \
            --model claude-sonnet-5 \
            --max-cost-usd 5 \
            --no-publish \
            --json "$RUNNER_TEMP/eval-result.json"
          code=$?
          set -e

          # Print the diagnosis into the log, always. A first run of this job
          # failed in 13 seconds with nothing but "exit code 1": the result
          # JSON stayed on the runner, so the one fact needed to act on it —
          # WHY each arm stopped — was unreachable. A red check nobody can
          # diagnose is the mirror of the green check that measured nothing,
          # and this project has now shipped both.
          #
          # The distinction this surfaces is the one that keeps misleading
          # readers of the aggregate: `meanDelta: 0` with costUsd 0 and
          # turns 0 means the model was never called, NOT that the plugin
          # made no difference. Aborted and measured-as-equal look identical
          # one level up, so the per-arm errors are printed first.
          if [ -f "$RUNNER_TEMP/eval-result.json" ]; then
            echo "::group::Per-arm outcome (errors first — an aborted arm is not a measured zero)"
            jq -r '
              .cases[]? as $c
              | ($c.arms // {} | to_entries[])
              | "\($c.name) / \(.key): turns=\(.value[0].turns // 0) cost=\(.value[0].costUsd // 0) score=\(.value[0].score // 0) error=\(.value[0].error // "none")"
            ' "$RUNNER_TEMP/eval-result.json" || echo "(could not parse result JSON)"
            echo "::endgroup::"
            echo "::group::Aggregates"
            jq -r '{durationSeconds, costUsd, partial, aggregates}' "$RUNNER_TEMP/eval-result.json" || true
            echo "::endgroup::"

            # Turns, not cost, is the honest test of whether the agent ran.
            # Measured: an all-aborted suite still reported costUsd 0.0055,
            # because the graders are billed even when every arm stopped at
            # turns=0. Keying this on cost let the abort read as a real run.
            turns=$(jq -r '[.cases[]?.arms[]?[]?.turns // 0] | add // 0' "$RUNNER_TEMP/eval-result.json")
            if [ "$turns" = "0" ]; then
              echo "::error::The eval suite ABORTED before calling the model (0 agent turns across all arms). Any delta in the aggregate above is an artefact of that abort, not a measurement — grader calls still cost money, so a non-zero costUsd does not mean the agent ran. Read the per-arm errors."
            fi
          else
            echo "::error::No result JSON was written — the suite failed before it could report."
          fi
          exit $code
          # --scaffold: the existing-claude-md case's fixture — a hand-written
          # CLAUDE.md the skill must never overwrite in place — has to land in
          # the run's actual workspace root, not a side directory. The shipped
          # schema (checked against `claude plugin eval --help` and the
          # plugin-evals reference on CLI 2.1.289) has no declarative "write
          # these files into the workspace" field: context.add_dirs grants
          # read access to a separate directory, not the workspace itself, so
          # only context.scaffold_script can place it. The script
          # (evals/existing-claude-md/fixture.sh) just writes a handful of
          # literal files and runs `git init` — it is reviewed in this repo
          # like any other source file, at the same trust level --trust-plugin
          # already asserts for the plugin's own code, and the eval never
          # starts without --scaffold passed explicitly, here, on purpose.
          # --threshold: left at the default of 1.0. Each case has 2-3 scored
          # graders (tool_used: Skill is with-only and not among them) at
          # equal weight, so no achievable score falls between 0.8 and 1.0 —
          # loosening it to 0.8 would change nothing here and would just be a
          # number that reads as more lenient than it is.
          # --judge-model: left at the default (haiku). Both llm graders in
          # this suite are concrete, checkable claims ("does the reply name
          # the file it found" / "does it ask instead of guess"), not
          # nuanced preference judgments that need a stronger judge.
          # --runs: left unset, so each case's own `runs: 1` (prompt.md
          # frontmatter) governs it. That is a deliberate starting point to
          # prove the suite executes without spending a full three-run budget
          # per arm — see the task report for what raising it to 3 would buy
          # and why it isn't done here yet.
          #
          # Needs CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, billed to
          # a Claude subscription) or ANTHROPIC_API_KEY (API billing) as a
          # repository secret, or this job fails at the first run with an auth
          # error, not a plugin regression. eval-gate skips the job rather than
          # letting that happen.
          #
          # CI is the only place this suite can run reliably. Measured on a
          # Windows dev machine: `--scaffold` hands the scaffold path to
          # /bin/bash as a native Windows path and bash eats the backslashes
          # (exit 127), and under WSL the Bash sandbox refuses while ~/.docker
          # holds a symlink inside it. A clean Linux runner has neither
          # problem, which is why the measurement lives here and not in a
          # local script someone is expected to remember to run.
      # Keep the evidence even when the job fails — especially then. The JSON
      # carries the per-arm errors and the HTML report carries the transcripts,
      # and both live on the runner, which is deleted minutes later.
      - name: Upload the eval result and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: |
            ${{ runner.temp }}/eval-result.json
            evals/results/
          if-no-files-found: warn
          retention-days: 14
