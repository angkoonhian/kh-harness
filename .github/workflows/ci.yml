name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin manifest
        shell: bash
        run: |
          set +e
          claude plugin validate . --strict
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::claude plugin validate itself failed (exit 2) — this is a toolchain problem, not a plugin problem"
            exit 1
          elif [ "$code" -ne 0 ]; then
            echo "::error::plugin manifest is invalid or has warnings under --strict (exit $code)"
            exit 1
          fi
          echo "plugin manifest validated"
